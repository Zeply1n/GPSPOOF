[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gpspoof"
version = "1.0.0"
description = "Persistent iPhone GPS simulation controller"
requires-python = ">=3.11"
dependencies = [
  "pymobiledevice3==4.18.0",
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "python-multipart==0.0.20",
  "pydantic==2.11.7",
]

[project.optional-dependencies]
test = ["pytest==8.4.1", "pytest-asyncio==1.1.0", "httpx==0.28.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
py-modules = ["gpspoof", "gps_engine", "pmd_backend", "device_manager", "autotune", "state_store", "route_engine", "models"]
